<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathematische Grundlagen der Informatik – Lernmodul</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      margin: 20px;
      color: #222;
      background: #fff;
    }

    h1 {
      margin-bottom: 0.3rem;
    }

    a {
      color: #0a66c2;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .node {
      margin-left: 1rem;
      border-left: 2px solid #ddd;
      padding-left: 0.75rem;
      margin-top: 0.35rem;
    }

    .title {
      cursor: pointer;
      background: #f0f8ff;
      padding: 0.4rem 0.6rem;
      margin: 0.2rem 0;
      border-radius: 6px;
      user-select: none;
      display: inline-block;
      min-width: 240px;
    }

    .title:hover {
      background: #e0eaff;
    }

    .title::before {
      content: "▶ ";
      font-size: 0.9em;
      color: #555;
    }

    .title.open::before {
      content: "▼ ";
    }

    .content {
      display: none;
      margin-top: 0.35rem;
    }

    .content.open {
      display: block;
    }

    .leaf {
      margin: 0.2rem 0 0.2rem 1.1rem;
      padding: 0.15rem 0;
    }

    .description {
      margin: 0.4rem 0 0.4rem 1.1rem;
      padding: 0.6rem 0.8rem;
      background: #f9f9f9;
      border-left: 3px solid #0a66c2;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #333;
    }

    .example-text {
      margin: 0.3rem 0 0.3rem 1.1rem;
      padding: 0.5rem 0.8rem;
      background: #f0f8ff;
      border-left: 2px solid #87ceeb;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .note-text {
      margin: 0.3rem 0 0.3rem 1.1rem;
      padding: 0.5rem 0.8rem;
      background: #fff3cd;
      border-left: 2px solid #ffc107;
      font-size: 0.9rem;
      font-style: italic;
    }

    .meta {
      margin-left: 1rem;
      margin-bottom: 1rem;
    }

    .section-label {
      font-weight: bold;
      margin: 0.5rem 0 0.2rem 0;
    }
  </style>
</head>

<body>

  <h1>Mathematische Grundlagen der Informatik</h1>
  <div class="meta">
    <a href="#" target="_blank" rel="noopener noreferrer">
      Modullink
    </a>
  </div>

  <div id="app"></div>

    function createNode(nodeData) {
      const node = document.createElement("div");
      node.className = "node";

      const hasChildren = Array.isArray(nodeData.children) && nodeData.children.length > 0;

      if (hasChildren) {
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = nodeData.title;

        const content = document.createElement("div");
        content.className = "content";

        nodeData.children.forEach(child => {
          content.appendChild(createNode(child));
        });

        title.addEventListener("click", () => {
          content.classList.toggle("open");
          title.classList.toggle("open");
        });

        node.appendChild(title);
        node.appendChild(content);
      } else {
        // Leaf node - check if it has description
        if (nodeData.description || nodeData.examples || nodeData.note) {
          // Make it expandable
          const title = document.createElement("div");
          title.className = "title";
          title.textContent = nodeData.title;

          const content = document.createElement("div");
          content.className = "content";

          // Add description
          if (nodeData.description) {
            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = nodeData.description;
            content.appendChild(desc);
          }

          // Add examples
          if (nodeData.examples && nodeData.examples.length > 0) {
            const exampleDiv = document.createElement("div");
            exampleDiv.className = "example-text";
            exampleDiv.textContent = nodeData.examples.join("\n");
            content.appendChild(exampleDiv);
          }

          // Add note
          if (nodeData.note) {
            const noteDiv = document.createElement("div");
            noteDiv.className = "note-text";
            noteDiv.textContent = nodeData.note;
            content.appendChild(noteDiv);
          }

          title.addEventListener("click", () => {
            content.classList.toggle("open");
            title.classList.toggle("open");
          });

          node.appendChild(title);
          node.appendChild(content);
        } else {
          // Simple leaf without description
          const leaf = document.createElement("div");
          leaf.className = "leaf";
          leaf.textContent = nodeData.title;
          node.appendChild(leaf);
        }
      }

      return node;
    }

    const app = document.getElementById("app");
    app.appendChild(createNode(data));
