    function createNode(nodeData) {
      const node = document.createElement("div");
      node.className = "node";

      const hasChildren = Array.isArray(nodeData.children) && nodeData.children.length > 0;
      const hasCode = nodeData.code && nodeData.code.length > 0;
      const hasDescription = nodeData.description && nodeData.description.length > 0;
      const hasExamples = nodeData.examples && nodeData.examples.length > 0;
      const hasNote = nodeData.note && nodeData.note.length > 0;
      const hasContent = hasCode || hasDescription || hasExamples || hasNote;

      if (hasChildren) {
        const title = document.createElement("div");
        title.className = "title";
        title.textContent = nodeData.title;

        const content = document.createElement("div");
        content.className = "content";

        // Add description if exists
        if (hasDescription) {
          const desc = document.createElement("div");
          desc.className = "description";
          desc.textContent = nodeData.description;
          content.appendChild(desc);
        }

        // Add examples if exists
        if (hasExamples) {
          const exampleDiv = document.createElement("div");
          exampleDiv.className = "example-text";
          exampleDiv.textContent = nodeData.examples.join("\n");
          content.appendChild(exampleDiv);
        }

        // Add code if exists
        if (hasCode) {
          const codeLabel = document.createElement("div");
          codeLabel.className = "code-label";
          codeLabel.textContent = "Code-Beispiel:";
          content.appendChild(codeLabel);

          const codeBlock = document.createElement("div");
          codeBlock.className = "code-block";
          codeBlock.textContent = nodeData.code;
          content.appendChild(codeBlock);
        }

        // Add note if exists
        if (hasNote) {
          const noteDiv = document.createElement("div");
          noteDiv.className = "note-text";
          noteDiv.textContent = nodeData.note;
          content.appendChild(noteDiv);
        }

        nodeData.children.forEach(child => {
          content.appendChild(createNode(child));
        });

        title.addEventListener("click", () => {
          content.classList.toggle("open");
          title.classList.toggle("open");
        });

        node.appendChild(title);
        node.appendChild(content);
      } else {
        if (hasContent) {
          const titleDiv = document.createElement("div");
          titleDiv.className = "title";
          titleDiv.textContent = nodeData.title;

          const content = document.createElement("div");
          content.className = "content";

          // Add description if exists
          if (hasDescription) {
            const desc = document.createElement("div");
            desc.className = "description";
            desc.textContent = nodeData.description;
            content.appendChild(desc);
          }

          // Add examples if exists
          if (hasExamples) {
            const exampleDiv = document.createElement("div");
            exampleDiv.className = "example-text";
            exampleDiv.textContent = nodeData.examples.join("\n");
            content.appendChild(exampleDiv);
          }

          // Add code if exists
          if (hasCode) {
            const codeLabel = document.createElement("div");
            codeLabel.className = "code-label";
            codeLabel.textContent = "Code-Beispiel:";
            content.appendChild(codeLabel);

            const codeBlock = document.createElement("div");
            codeBlock.className = "code-block";
            codeBlock.textContent = nodeData.code;
            content.appendChild(codeBlock);
          }

          // Add note if exists
          if (hasNote) {
            const noteDiv = document.createElement("div");
            noteDiv.className = "note-text";
            noteDiv.textContent = nodeData.note;
            content.appendChild(noteDiv);
          }

          titleDiv.addEventListener("click", () => {
            content.classList.toggle("open");
            titleDiv.classList.toggle("open");
          });

          node.appendChild(titleDiv);
          node.appendChild(content);
        } else {
          const leaf = document.createElement("div");
          leaf.className = "leaf";
          leaf.textContent = nodeData.title;
          node.appendChild(leaf);
        }
      }

      return node;
    }

    const app = document.getElementById("app");
    app.appendChild(createNode(data));
  </script>
